<div class="export-dialog">
  <h2 mat-dialog-title translate>export.dialogTitle</h2>
  <div mat-dialog-content class="export-dialog__content">
    <p class="export-dialog__description" translate>export.dialogDescription</p>
    <div class="export-dialog__options">
      @for (option of options; track option.id) {
        <label
          class="export-dialog__option"
          [class.export-dialog__option--selected]="option.selected"
          [class.export-dialog__option--disabled]="option.disabled"
          [class.export-dialog__option--centered]="!option.hintKey"
        >
          <mat-checkbox
            color="primary"
            [checked]="option.selected"
            [disabled]="option.disabled"
            (change)="toggle(option, $event.checked)"
          />
          <span class="export-dialog__option-label">
            <span class="export-dialog__option-title">{{ option.labelKey | translate }}</span>
            @if (option.hintKey) {
              <span class="export-dialog__option-hint">{{ option.hintKey | translate }}</span>
            }
          </span>
        </label>
      }
    </div>
  </div>
  <div mat-dialog-actions class="export-dialog__actions">
    <button asset-sg-secondary (click)="cancel()" translate>cancel</button>
    <button asset-sg-primary [disabled]="isExportDisabled" (click)="confirm()" translate>export.export</button>
  </div>
</div>
