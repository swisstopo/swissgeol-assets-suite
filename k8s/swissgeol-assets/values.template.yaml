# Max time (in milliseconds) an S3 socket may be idle (no data received) before the request is
# aborted. Defaults to 300000 (5 minutes) when left empty. Set to 0 to disable.
s3_socket_timeout:

# Basic auth settings for additional authentication via middleware. If true, set secret values for basicAuthUsername and basicAuthPassword.
basicAuthEnabled: false
